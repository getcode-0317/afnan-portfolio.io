
hugoblox:
  schema: "2.0"

  # IDENTITY
  identity:
    name: "Afnan Ahmad"
    organization: ""
    type: person
    tagline: "Digital Marketer | SEO & Paid Advertising"
    description: "Afnan Ahmad — Digital Marketer specializing in SEO, Link Building, Guest Posting, Google Ads, Meta Ads and TikTok Ads."
    social:
      twitter: ""

  # THEME
  theme:
    mode: dark
    pack: "default"
    colors:
      primary: "#8065D9"
      secondary: "#25204A"
      neutral: "#64748B"
      colors_light: {}
      colors_dark: {}
   # TYPOGRAPHY
  typography:
    pack: "modern"

  # LAYOUT
  layout:
    radius: "lg"
    spacing: "spacious"
    avatar_shape: rounded

  # HEADER
  header:
    enable: true
    style: navbar
    sticky: true
    align: center
    search: false
    theme_toggle: false
    theme_picker: false
    language_switcher: false
    cta:
      enable: true
      text: "Let's Talk"
      url: "#contact"

  # FOOTER
  footer:
    style: minimal
    language_switcher: false
    text: "Building digital growth through SEO and performance marketing."

  # COPYRIGHT
  copyright:
    notice: "© {year} {name}. All rights reserved."
    license:
      type: custom
      allow_derivatives: true
      share_alike: false
      allow_commercial: true

  # SEO
  seo:
    title: "Afnan Ahmad | Digital Marketer"
    location:
      address:
        street: ""
        city: "Faisalabad"
        region: "Punjab"
        postal_code: ""
        country: "Pakistan"
      coordinates:
        latitude: null
        longitude: null
      phone: ""
    ai:
      allow:
        - /
      disallow: []
      note: "Professional portfolio of Afnan Ahmad, Digital Marketer."
      contact: "shafnanah123@gmail.com"

  # CONTENT
  content:
    math:
      enable: false
    toc:
      enable: false
    reading_time:
      enable: false
    citations:
      style: apa

  # SEARCH
  search:
    enable: false
    suggestions: []
    quick_actions: []

  # COMMENTS
  comments:
    enable: false
    provider: ""
    giscus:
      repo: ""
      repo_id: ""
      category: ""
      category_id: ""
    disqus:
      shortname: ""

  # ANALYTICS
  analytics:
    google:
      measurement_id: ""
    google_tag_manager:
      container_id: ""
    plausible:
      domain: ""
    fathom:
      site_id: ""
    pirsch:
      site_id: ""
    clarity:
      project_id: ""
    baidu:
      site_id: ""

  # VERIFICATION
  verification:
    google: ""
    bing: ""
    baidu: ""
    yandex: ""
    pinterest: ""
    naver: ""

  # REPOSITORY
  repository:
    enable: false
    url: ""
    branch: main
    content_dir: content

  # LOCALE
  locale:
    date_format: "Jan 2, 2006"
    time_format: "3:04 PM"
    address_format: en-us

  # SECURITY
  security:
    csp:
      policy: ""
      report_only: false
    frame_options: allow
    permissions_policy: ""

  # PRIVACY
  privacy:
    enable: false
    anonymize_analytics: true

  # DEBUG
  debug:
    enable: false
    hud:
      position: bottom-left
      opacity: 1.0
    export_logs: false

  # PREMIUM
  pro:
    hide_attribution: false
    affiliate_code: ""
